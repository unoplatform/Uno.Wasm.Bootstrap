# Reusable AzDO template: Cleanup unused dependencies on Linux CI agents.
# Calls the shared host-cleanup-linux.sh script to avoid duplication with GitHub Actions.
#
# Parameters:
#   target - set to 'host' when the job runs in a container, so the cleanup runs
#            on the host VM, where the removed paths exist. Inside the container
#            it frees nothing.
parameters:
  - name: target
    type: string
    default: ''

steps:
  - bash: |
      bash "$(Build.SourcesDirectory)/build/ci/scripts/host-cleanup-linux.sh"
    displayName: Cleanup unused host dependencies
    condition: eq(variables['Agent.OS'], 'Linux')
    ${{ if ne(parameters.target, '') }}:
      target: ${{ parameters.target }}