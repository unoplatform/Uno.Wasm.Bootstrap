<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script type="text/javascript" src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)
</head>
<body>
    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader"
             loading-position="bottom"
             loading-alert="none"
             data-phase="connect">

            <!-- Logo: change src to customize the logo -->
            <img class="logo"
                 src=""
                 alt=""
                 title="Uno is loading your application" />

            <div class="bar">
                <progress max="100" aria-label="Loading"></progress>
                <i class="fill"></i>
                <i class="sweep"></i>
            </div>

            <div class="info">
                <div class="status" role="status" aria-live="polite">
                    <span class="alert" aria-hidden="true"></span>
                    <span class="label"></span>
                </div>
                <div class="meta"></div>
                <div class="hint" role="status" aria-live="polite"></div>
                <button class="reload" type="button">Reload</button>
            </div>
        </div>
    </div>
    <noscript>
        <p>This application requires Javascript and WebAssembly to be enabled.</p>
    </noscript>
</body>
</html>
